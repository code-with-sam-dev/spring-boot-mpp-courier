spring.application.name=courier-api
server.port=8090
spring.threads.virtual.enabled=true

# Premium quote: 0.05 pathUSD per request on Tempo testnet. Testnet tokens only.
courier.premium.price=0.05
courier.premium.recipient=${COURIER_RECIPIENT_ADDRESS:}
courier.premium.realm=localhost:8090
courier.premium.secret-key=${MPP_SECRET_KEY:}

# Break chapter only: how many paid responses to drop after payment. 0 is honest.
courier.misbehaviour.lose-paid-responses=0

# What each payment bought, kept across restarts.
spring.datasource.url=jdbc:h2:file:./runs/courier-db
spring.sql.init.mode=always
