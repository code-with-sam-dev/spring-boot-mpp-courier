spring.application.name=retailer-assistant
server.port=8080
spring.threads.virtual.enabled=true

# MCP server over streamable HTTP at /mcp
spring.ai.mcp.server.name=courier-assistant
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

assistant.courier.base-url=http://localhost:8090

# The payer key is read from .env, which is gitignored. Testnet only.
assistant.payment.payer-private-key=${PAYER_PRIVATE_KEY}

# The payment authority the assistant has, in pathUSD.
assistant.payment.policy.max-per-request=0.10
assistant.payment.policy.daily-budget=0.25
assistant.payment.policy.allowed-recipients=${COURIER_RECIPIENT_ADDRESS}
assistant.payment.policy.currency=0x20c0000000000000000000000000000000000000
assistant.payment.policy.chain-id=42431

# Payment operations and the audit trail survive a restart.
spring.datasource.url=jdbc:h2:file:./runs/assistant-db
spring.sql.init.mode=always
